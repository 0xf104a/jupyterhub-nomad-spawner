[project]
name = "jupyterhub-nomad-spawner"
version = "0.1.0"
description = "A JupyterHub Spawner that launches isolated notebook servers as Nomad jobs"
authors = [{ name = "Max Fröhlich", email = "maxbruchmann@gmail.com" }]
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Jupyter",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "jupyterhub>=6.0.0",
    "traitlets>=5.14.0",
    "pydantic>=2.10.0",
    "tenacity>=9.0.0",
    "httpx>=0.28.0",
    "attrs>=24.2.0",
    "jinja2>=3.1.4",
]

[project.entry-points."jupyterhub.spawners"]
nomad-spawner = "jupyterhub_nomad_spawner.spawner:NomadSpawner"

[tool.poetry]
packages = [{ include = "jupyterhub_nomad_spawner" }]
requires-poetry = ">=2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0"
pytest-asyncio = ">=1.3"
respx = ">=0.23"
requests = ">=2.32"
black = ">=26.1"
isort = ">=6.0"
flake8 = ">=7.3"
mypy = ">=1.18"
poethepoet = ">=0.40"
datamodel-code-generator = ">=0.80"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poe.tasks]
# The Nomad OpenAPI project (hashicorp/nomad-openapi) is archived, but the
# published v1 spec still matches the endpoints used by this spawner.
gen-nomad-model = """
datamodel-codegen
  --url https://raw.githubusercontent.com/hashicorp/nomad-openapi/main/v1/openapi.yaml
  --input-file-type openapi
  --output-model-type pydantic_v2.BaseModel
  --target-python-version 3.10
  --use-annotated
  --field-constraints
  --disable-timestamp
  --formatters black isort
  --output jupyterhub_nomad_spawner/nomad/nomad_model.py
"""
format = ["_black", "_isort"]
_black = "black ."
_isort = "isort ."
mypy = "mypy ."
flake8 = "flake8 ."
test = "pytest"
check = ["format", "mypy", "flake8", "test"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
exclude = [
    "^jupyterhub_nomad_spawner/nomad/nomad_model\\.py$",
    "^example/",
    "^\\.venv/",
]

[tool.isort]
profile = "black"
known_first_party = ["jupyterhub_nomad_spawner"]
skip_gitignore = true

[tool.black]
extend-exclude = "^/jupyterhub_nomad_spawner/nomad/nomad_model\\.py$"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: Run the integration tests.",
]
